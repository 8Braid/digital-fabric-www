name: Status observation tests
on:
  pull_request:
    paths: ['explorer.html', 'assets/js/ledger-status.js', 'scripts/refresh_ledger_status.py', 'tests/**', '.github/workflows/test-status.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/ledger-status.test.cjs
